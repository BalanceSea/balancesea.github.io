name: Deploy Cloud Wiki to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate plugin registry
        run: node scripts/generate-plugin-registry.mjs

      - name: Prepare public Wiki
        run: |
          mkdir -p .pages-site
          cp index.html styles.css script.js catalog-data.js plugin-navigation.js plugin-common.js favicon.svg .nojekyll .pages-site/
          cp -R plugins .pages-site/plugins
          find .pages-site/plugins -name plugin.json -delete

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
